name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements.txt
      - run: pytest -q backend/tests
        env:
          PYTHONPATH: backend/src:.
          LIVE_TRADING_ENABLED: "false"
          REGISTRY_DB_PATH: ${{ runner.temp }}/waterfall_registry.db

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: python -m pip install --upgrade pip pip-audit
      - name: Audit Python dependencies
        run: |
          # Temporary upstream exceptions: ccxt 4.5.68 hard-pins aiohttp
          # 3.14.1 and cryptography 49.0.0. Remove these exact exceptions as
          # soon as ccxt releases compatible dependency pins. Every other
          # Python vulnerability remains CI-blocking.
          pip-audit -r backend/requirements.txt \
            --ignore-vuln PYSEC-2026-3545 \
            --ignore-vuln PYSEC-2026-3546 \
            --ignore-vuln PYSEC-2026-3547 \
            --ignore-vuln PYSEC-2026-3552
      - run: npm ci
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend

  container-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose build waterfall-backend frontend watchdog

  repository-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Reject tracked runtime and secret files
        shell: bash
        run: |
          set -euo pipefail
          forbidden='(^|/)(\.env|.*\.db|.*\.sqlite3?|.*\.log|.*\.bak|.*\.zip|id_rsa|id_ed25519)$'
          if git ls-files | grep -E "$forbidden"; then
            echo "Forbidden runtime/secret-like file is tracked."
            exit 1
          fi
      - name: Scan tracked text for common credential patterns
        shell: bash
        run: |
          set -euo pipefail
          pattern='(-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|AIza[0-9A-Za-z_-]{30,}|sk-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9]{20,})'
          if git grep -nEI "$pattern" -- ':!package-lock.json'; then
            echo "Potential credential found in tracked content."
            exit 1
          fi
