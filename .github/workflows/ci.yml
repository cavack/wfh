name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PYTHON_RUNTIME: "3.13"
  NODE_RUNTIME: "26"

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_RUNTIME }}
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m pip install --upgrade pip
      - run: "python -m pip install --only-binary=:all: --require-hashes -r backend/requirements.lock"
      - run: pytest -q backend/tests
        env:
          PYTHONPATH: backend/src:.
          LIVE_TRADING_ENABLED: "false"
          REGISTRY_DB_PATH: ${{ runner.temp }}/waterfall_registry.db
      - name: Validate WaterfallHunter engineering skills
        run: python scripts/validate_wfh_skills.py
      - run: PYTHONPATH=backend/src:. python scripts/verify_runtime_parity.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_RUNTIME }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_RUNTIME }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_RUNTIME }}
      - run: python -m pip install --upgrade pip pip-audit
      - name: Audit Python dependencies
        run: |
          pip-audit --require-hashes -r backend/requirements.lock
          pip-audit --require-hashes -r watchdog/requirements.lock
      - run: npm ci
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend

  container-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - name: Build revision-labelled production artifacts
        run: |
          BUILD_DATE="$(git show -s --format=%cI HEAD)"
          docker compose build \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --build-arg BUILD_DATE="$BUILD_DATE" \
            --build-arg VERSION="$GITHUB_REF_NAME" \
            waterfall-backend frontend watchdog
      - name: Test the exact backend artifact family
        run: |
          docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m \
            -e LIVE_TRADING_ENABLED=false \
            -e REGISTRY_DB_PATH=/tmp/waterfall_registry.db \
            -e PYTHONPATH=/app/src:/project \
            -v "$PWD:/project:ro" \
            -w /project \
            waterfallhunter-waterfall-backend \
            pytest -q backend/tests
      - name: Record exact tested backend image digest
        run: |
          set -euo pipefail
          TESTED_BACKEND_IMAGE_DIGEST="$(docker image inspect waterfallhunter-waterfall-backend --format '{{.Id}}')"
          if ! [[ "$TESTED_BACKEND_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid tested backend image digest" >&2
            exit 1
          fi
          echo "WFH_TESTED_BACKEND_IMAGE_DIGEST=$TESTED_BACKEND_IMAGE_DIGEST"
      - name: Verify OCI revision labels
        run: |
          test "$(docker image inspect waterfallhunter-waterfall-backend --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
          test "$(docker image inspect waterfallhunter-frontend --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
          test "$(docker image inspect waterfallhunter-watchdog --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"

  repository-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Reject tracked runtime and secret files
        shell: bash
        run: |
          set -euo pipefail
          forbidden='(^|/)(\.env|.*\.db|.*\.sqlite3?|.*\.log|.*\.bak|.*\.zip|id_rsa|id_ed25519)$'
          if git ls-files | grep -E "$forbidden"; then
            echo "Forbidden runtime/secret-like file is tracked."
            exit 1
          fi
      - name: Scan tracked text for common credential patterns
        shell: bash
        run: |
          set -euo pipefail
          pattern='(-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|AIza[0-9A-Za-z_-]{30,}|sk-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9]{20,})'
          if git grep -nEI "$pattern" -- ':!package-lock.json'; then
            echo "Potential credential found in tracked content."
            exit 1
          fi
