name: Regenerate Wave1D Once

on:
  push:
    branches: [fix/v7-pre-dashboard-gaps]
    paths:
      - .github/workflows/regenerate-wave1d-once.yml
      - scripts/build_canonical_golden_corpus.py

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/v7-pre-dashboard-gaps
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m pip install --only-binary=:all: --require-hashes -r backend/requirements.lock
      - name: Regenerate canonical Wave 1D fixture
        env:
          PYTHONPATH: backend/src:.
          LIVE_TRADING_ENABLED: "false"
        run: python scripts/build_wave1d_semantics_corpus.py
      - name: Commit only deterministic fixture delta
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- . ':!backend/tests/golden/wave1d_semantics_corpus.json' || {
            echo "Unexpected generated changes" >&2
            exit 1
          }
          if git diff --quiet -- backend/tests/golden/wave1d_semantics_corpus.json; then
            echo "Wave 1D fixture already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/tests/golden/wave1d_semantics_corpus.json
          git commit -m "test: regenerate Wave 1D ranking fixture"
          git push origin HEAD:fix/v7-pre-dashboard-gaps
