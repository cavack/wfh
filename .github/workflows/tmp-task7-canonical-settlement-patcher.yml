name: tmp-task7-canonical-settlement-patcher

on:
  push:
    branches:
      - feat/wave1c2-persistence-legacy-classification-v1
    paths:
      - .github/workflows/tmp-task7-canonical-settlement-patcher.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/wave1c2-persistence-legacy-classification-v1
          fetch-depth: 0
      - name: Apply exact Task 7 canonical settlement patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/src/waterfallhunter/core/lbank_signal_outcome.py")
          text = path.read_text(encoding="utf-8")
          old = '''                    SELECT
                        s.id,
                        s.symbol,
                        s.triggered_at,
                        s.entry_price,
                        s.stop_loss,
                        s.take_profit_1,
                        s.take_profit_2,
                        s.trigger_metrics_json
                    FROM lbank_signal_ledger AS s
                    LEFT JOIN lbank_signal_outcomes AS o
                        ON o.signal_id = s.id
                    WHERE
                        o.signal_id IS NULL
                        AND s.triggered_at <= ?
                    ORDER BY s.triggered_at, s.id
                    LIMIT ?
          '''
          new = '''                    SELECT
                        s.signal_id AS id,
                        s.symbol,
                        s.triggered_at,
                        s.entry_price,
                        s.stop_loss,
                        s.take_profit_1,
                        s.take_profit_2,
                        s.trigger_metrics_json,
                        s.signal_class,
                        s.strategy_profile
                    FROM canonical_signal_view AS s
                    LEFT JOIN lbank_signal_outcomes AS o
                        ON o.signal_id = s.signal_id
                    WHERE
                        o.signal_id IS NULL
                        AND s.triggered_at <= ?
                    ORDER BY s.triggered_at, s.signal_id
                    LIMIT ?
          '''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Task 7 anchor count was {count}, expected 1")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          git rm .github/workflows/tmp-task7-canonical-settlement-patcher.yml
          git config user.name "wfh-task7-patcher"
          git config user.email "actions@github.com"
          git add backend/src/waterfallhunter/core/lbank_signal_outcome.py
          git commit -m "feat: settle outcomes from canonical signal cohorts"
          git push origin HEAD:feat/wave1c2-persistence-legacy-classification-v1
