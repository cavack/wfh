name: Wave1C1 Schema Review Fix

on:
  push:
    branches:
      - feat/wave1c1-metadata-foundation-v1
    paths:
      - .github/workflows/wave1c1-schema-review-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/wave1c1-metadata-foundation-v1
      - name: Apply exact schema contract review fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/src/waterfallhunter/core/schema_contract.py')
          text = path.read_text(encoding='utf-8')

          old_checks = '''            "check(reference_observed_at is null or reference_observed_at >= 0)",
            "check(metadata_contract_version = 'signal_metadata_v1')",
        ),'''
          new_checks = '''            "check(reference_observed_at is null or reference_observed_at >= 0)",
            "check(metadata_contract_version = 'signal_metadata_v1')",
            "check(classification_method in ('FUTURE_PIPELINE_EXPLICIT', 'LEGACY_PROFILE_EXACT_MATCH'))",
            (
                "check((classification_method = 'FUTURE_PIPELINE_EXPLICIT' "
                "and classification_evidence_hash is null) or "
                "(classification_method = 'LEGACY_PROFILE_EXACT_MATCH' "
                "and length(classification_evidence_hash) = 64 "
                "and classification_evidence_hash not glob '*[^0-9a-f]*'))"
            ),
            (
                "check((signal_class = 'STRICT' and strategy_profile = 'strict_score_v2') "
                "or (signal_class = 'EXPERIMENTAL' "
                "and strategy_profile = 'experimental_pretrigger_v1'))"
            ),
        ),'''
          if text.count(old_checks) != 1:
              raise SystemExit(f'check anchor count={text.count(old_checks)}')
          text = text.replace(old_checks, new_checks, 1)

          old_view = '''            "m.signal_class",
            "m.strategy_profile",
            "m.decision_contract_hash",
        ),'''
          new_view = '''            "m.signal_class",
            "m.strategy_profile",
            "m.score_version",
            "m.model_generation",
            "m.decision_contract_hash",
            "m.analysis_observed_at",
            "m.reference_observed_at",
            "m.metadata_contract_version",
            "m.classification_method",
            "m.classification_evidence_hash",
        ),'''
          if text.count(old_view) != 1:
              raise SystemExit(f'view anchor count={text.count(old_view)}')
          text = text.replace(old_view, new_view, 1)

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- backend/src/waterfallhunter/core/schema_contract.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/src/waterfallhunter/core/schema_contract.py
          git commit -m 'fix: enforce complete signal metadata schema contract'
          git push origin HEAD:feat/wave1c1-metadata-foundation-v1
