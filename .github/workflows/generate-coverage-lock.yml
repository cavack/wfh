name: Generate Coverage Lock

on:
  pull_request:
    paths:
      - .github/workflows/generate-coverage-lock.yml

permissions: {}

jobs:
  generate:
    if: github.head_ref == 'chore/advisory-security-coverage-v1'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: chore/advisory-security-coverage-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Generate hash-locked coverage environment
        shell: bash
        run: |
          python -m pip install pip-tools==7.6.0
          printf '%s\n' '-r requirements.txt' 'pytest-cov==7.1.0' > backend/coverage-requirements.in
          python -m piptools compile \
            --generate-hashes \
            --allow-unsafe \
            --strip-extras \
            --output-file=backend/coverage-requirements.lock \
            backend/coverage-requirements.in

          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/coverage.yml')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'cache-dependency-path: backend/requirements.txt',
              'cache-dependency-path: backend/coverage-requirements.lock',
          )
          old = '''      - name: Install backend and coverage dependencies\n        run: |\n          python -m pip install --upgrade pip\n          python -m pip install -r backend/requirements.txt\n          python -m pip install pytest-cov==7.1.0\n'''
          new = '''      - name: Install locked backend and coverage dependencies\n        run: |\n          python -m pip install --only-binary=:all: --require-hashes \\\n            -r backend/coverage-requirements.lock\n'''
          if old not in text:
              raise SystemExit('coverage install block anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/coverage-requirements.in backend/coverage-requirements.lock .github/workflows/coverage.yml
          git commit -m 'fix: hash-lock coverage dependency graph'
          git push origin HEAD:chore/advisory-security-coverage-v1
