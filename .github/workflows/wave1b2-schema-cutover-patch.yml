name: Wave 1B2 schema cutover patch

on:
  push:
    branches:
      - feat/wave1b2-schema-ownership-cutover-v1
    paths:
      - .github/workflows/wave1b2-schema-cutover-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/wave1b2-schema-ownership-cutover-v1
          fetch-depth: 0

      - name: Apply asserted schema-owner cutover patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one literal match, got {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          def regex_once(path: str, pattern: str, replacement: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{path}: expected one regex match, got {count}")
              target.write_text(updated, encoding="utf-8")

          feature = "backend/src/waterfallhunter/core/feature_replay.py"
          replace_once(
              feature,
              "from waterfallhunter.core.position_calculator import PositionCalculator\n",
              "from waterfallhunter.core.position_calculator import PositionCalculator\n"
              "from waterfallhunter.core.schema_contract import require_managed_schema\n",
          )
          regex_once(
              feature,
              r'class FeatureReplayStore:\n    def __init__\(self, db_path: str = "/app/data/waterfall_registry\.db"\):\n        self\.db_path = db_path\n        self\._init_db\(\)\n\n    def _connect\(self\):\n        return sqlite3\.connect\(self\.db_path, timeout=20\.0\)\n\n    def _init_db\(self\) -> None:\n.*?(?=\n    def pending\()',
              '''class FeatureReplayStore:\n    def __init__(\n        self,\n        db_path: str = "/app/data/waterfall_registry.db",\n        *,\n        verify_schema: bool = True,\n    ):\n        self.db_path = db_path\n        if verify_schema:\n            require_managed_schema(\n                self.db_path,\n                required_tables=frozenset(\n                    {\n                        "production_feature_replay_results_v2",\n                        "production_evidence_snapshots",\n                    }\n                ),\n            )\n\n    def _connect(self):\n        return sqlite3.connect(self.db_path, timeout=20.0)\n''',
          )

          evidence = "backend/src/waterfallhunter/core/production_evidence.py"
          replace_once(
              evidence,
              "from typing import Any\n",
              "from typing import Any\n\nfrom waterfallhunter.core.schema_contract import require_managed_schema\n",
          )
          regex_once(
              evidence,
              r'    def __init__\(\n        self,\n        db_path: str = "/app/data/waterfall_registry\.db",\n        \*,\n        bucket_seconds: int = 300,\n    \):\n.*?(?=\n    @classmethod\n    def _safe)',
              '''    def __init__(\n        self,\n        db_path: str = "/app/data/waterfall_registry.db",\n        *,\n        bucket_seconds: int = 300,\n        verify_schema: bool = True,\n    ):\n        self.db_path = db_path\n        self.bucket_seconds = max(60, int(bucket_seconds))\n        self._write_lock = threading.Lock()\n        self.total_recorded = 0\n        self.total_deduplicated = 0\n        self.total_failed = 0\n        if verify_schema:\n            require_managed_schema(\n                self.db_path,\n                required_tables=frozenset({"production_evidence_snapshots"}),\n            )\n\n    def _connect(self):\n        return sqlite3.connect(self.db_path, timeout=20.0)\n''',
          )

          decision = "backend/src/waterfallhunter/core/lbank_execution_decision.py"
          replace_once(
              decision,
              "from waterfallhunter.core.lbank_execution_candidate import (\n    LBankExecutionCandidateEnricher,\n)\n",
              "from waterfallhunter.core.lbank_execution_candidate import (\n    LBankExecutionCandidateEnricher,\n)\n"
              "from waterfallhunter.core.schema_contract import require_managed_schema\n",
          )
          regex_once(
              decision,
              r'    def __init__\(\n        self,\n        db_path: str,\n        \*,\n        enricher: LBankExecutionCandidateEnricher,\n        evaluation_bucket_seconds: int = 3600,\n        snapshot_interval_seconds: int = 3600,\n        retention_days: int = 30,\n        volume_gate_min_usdt: float = 2_000_000\.0,\n    \):\n.*?(?=\n    @staticmethod\n    def _finite)',
              '''    def __init__(\n        self,\n        db_path: str,\n        *,\n        enricher: LBankExecutionCandidateEnricher,\n        evaluation_bucket_seconds: int = 3600,\n        snapshot_interval_seconds: int = 3600,\n        retention_days: int = 30,\n        volume_gate_min_usdt: float = 2_000_000.0,\n        verify_schema: bool = True,\n    ):\n        self.db_path = db_path\n        self.enricher = enricher\n        self.evaluation_bucket_seconds = max(60, int(evaluation_bucket_seconds))\n        self.snapshot_interval_seconds = max(300, int(snapshot_interval_seconds))\n        self.retention_seconds = max(86_400, int(retention_days) * 86_400)\n        self.volume_gate_min_usdt = max(0.0, float(volume_gate_min_usdt))\n        self._pending_lock = threading.Lock()\n        self._pending: dict[tuple[int, str], dict] = {}\n        self.total_evaluations_observed = 0\n        self.total_evaluations_flushed = 0\n        self.last_flush_at: float | None = None\n        self.last_snapshot_at: float | None = None\n        if verify_schema:\n            require_managed_schema(\n                self.db_path,\n                required_tables=frozenset(\n                    {"lbank_execution_decision_log", "lbank_catalog"}\n                ),\n            )\n\n    def _connect(self):\n        return sqlite3.connect(self.db_path, timeout=20.0)\n''',
          )

          execution = "backend/src/waterfallhunter/core/lbank_execution_store.py"
          replace_once(
              execution,
              "from typing import Any\n",
              "from typing import Any\n\nfrom waterfallhunter.core.schema_contract import require_managed_schema\n",
          )
          regex_once(
              execution,
              r'    def __init__\(\n        self,\n        db_path: str = "/app/data/waterfall_registry\.db",\n    \):\n.*?(?=\n    @staticmethod\n    def _finite)',
              '''    def __init__(\n        self,\n        db_path: str = "/app/data/waterfall_registry.db",\n        *,\n        verify_schema: bool = True,\n    ):\n        self.db_path = db_path\n        if verify_schema:\n            require_managed_schema(\n                self.db_path,\n                required_tables=frozenset(\n                    {\n                        "lbank_catalog",\n                        "lbank_execution_observations",\n                        "lbank_execution_observation_history",\n                    }\n                ),\n            )\n\n    def _connect(\n        self,\n        timeout: float = 10.0,\n    ):\n        return sqlite3.connect(\n            self.db_path,\n            timeout=timeout,\n        )\n''',
          )
          PY

      - name: Verify Python syntax and runtime DDL ownership
        shell: bash
        run: |
          python -m compileall -q backend/src/waterfallhunter
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path("backend/src/waterfallhunter")
          owner = root / "core" / "migrations.py"
          ddl = re.compile(
              r"\b(?:CREATE\s+(?:TABLE|INDEX|TRIGGER)|ALTER\s+TABLE|DROP\s+(?:TABLE|INDEX|TRIGGER))\b",
              re.IGNORECASE,
          )
          violations = []
          for path in sorted(root.rglob("*.py")):
              if path == owner:
                  continue
              if ddl.search(path.read_text(encoding="utf-8")):
                  violations.append(str(path))
          if violations:
              raise SystemExit("runtime DDL remains: " + ", ".join(violations))
          PY

      - name: Commit asserted patch
        shell: bash
        run: |
          git config user.name "waterfallhunter-ci"
          git config user.email "actions@users.noreply.github.com"
          git add backend/src/waterfallhunter/core/feature_replay.py \
                  backend/src/waterfallhunter/core/production_evidence.py \
                  backend/src/waterfallhunter/core/lbank_execution_decision.py \
                  backend/src/waterfallhunter/core/lbank_execution_store.py
          git diff --cached --check
          git commit -m "refactor: finish runtime schema owner cutover"
          git push origin HEAD:feat/wave1b2-schema-ownership-cutover-v1
