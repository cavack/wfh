name: Wave 1B2 main startup patch

on:
  push:
    branches:
      - feat/wave1b2-schema-ownership-cutover-v1
    paths:
      - .github/workflows/wave1b2-main-startup-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/wave1b2-schema-ownership-cutover-v1
          fetch-depth: 0

      - name: Apply exact startup-gate replacements
        shell: python
        run: |
          from pathlib import Path

          path = Path("backend/src/waterfallhunter/main.py")
          text = path.read_text()

          replacements = [
              (
                  "from waterfallhunter.core.db import DBAdapter\n",
                  "from waterfallhunter.core.db import DBAdapter\n"
                  "from waterfallhunter.core.schema_contract import (\n"
                  "    CURRENT_RUNTIME_SCHEMA_VERSION,\n"
                  "    require_managed_schema,\n"
                  ")\n",
              ),
              (
                  "db = DBAdapter(\n    db_path=settings.registry_db_path,\n)\n",
                  "db = DBAdapter(\n    db_path=settings.registry_db_path,\n    verify_schema=False,\n)\n",
              ),
              (
                  "stage_lifecycle_store = StageLifecycleStore(\n    db_path=db.db_path,\n)\n",
                  "stage_lifecycle_store = StageLifecycleStore(\n    db_path=db.db_path,\n    verify_schema=False,\n)\n",
              ),
              (
                  "historical_outcome_store = HistoricalOutcomeStore(\n    db_path=db.db_path,\n    cache_ttl_seconds=60.0,\n)\n",
                  "historical_outcome_store = HistoricalOutcomeStore(\n    db_path=db.db_path,\n    cache_ttl_seconds=60.0,\n    verify_schema=False,\n)\n",
              ),
              (
                  "production_evidence_recorder = ProductionEvidenceRecorder(\n    db_path=db.db_path,\n    bucket_seconds=900,\n)\n",
                  "production_evidence_recorder = ProductionEvidenceRecorder(\n    db_path=db.db_path,\n    bucket_seconds=900,\n    verify_schema=False,\n)\n",
              ),
              (
                  "feature_replay_store = FeatureReplayStore(\n    db_path=db.db_path,\n)\n",
                  "feature_replay_store = FeatureReplayStore(\n    db_path=db.db_path,\n    verify_schema=False,\n)\n",
              ),
              (
                  "signal_ledger = LBankSignalLedger(\n    db_path=db.db_path,\n)\n",
                  "signal_ledger = LBankSignalLedger(\n    db_path=db.db_path,\n    verify_schema=False,\n)\n",
              ),
              (
                  "signal_outcome_store = LBankSignalOutcomeStore(\n    db_path=db.db_path,\n)\n",
                  "signal_outcome_store = LBankSignalOutcomeStore(\n    db_path=db.db_path,\n    verify_schema=False,\n)\n",
              ),
              (
                  "        volume_gate_min_usdt=(\n            scanner.min_volume_usdt\n        ),\n    )\n)\n\nvalidator = MultiExchangeValidator()\n",
                  "        volume_gate_min_usdt=(\n            scanner.min_volume_usdt\n        ),\n        verify_schema=False,\n    )\n)\n\nvalidator = MultiExchangeValidator()\n",
              ),
              (
                  "    if settings.live_trading_enabled:\n        raise RuntimeError(\n            \"LIVE_TRADING_ENABLED must remain \"\n            \"false for WaterfallHunter\"\n        )\n\n    _start_background_task(\n",
                  "    if settings.live_trading_enabled:\n        raise RuntimeError(\n            \"LIVE_TRADING_ENABLED must remain \"\n            \"false for WaterfallHunter\"\n        )\n\n    require_managed_schema(\n        db.db_path,\n        check_user_version=CURRENT_RUNTIME_SCHEMA_VERSION,\n    )\n\n    _start_background_task(\n",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match, got {count}: {old[:90]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text)

      - name: Verify patch shape
        run: |
          python -m compileall -q backend/src/waterfallhunter/main.py
          git diff --check
          git diff -- backend/src/waterfallhunter/main.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/waterfallhunter/main.py
          git diff --cached --quiet && exit 1
          git commit -m "fix: gate schema before startup workers"
          git push origin HEAD:feat/wave1b2-schema-ownership-cutover-v1
