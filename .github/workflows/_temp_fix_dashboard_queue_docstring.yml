name: Temporary dashboard queue syntax fix

on:
  push:
    branches:
      - hotfix/dashboard-sse-backpressure-20260827

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: hotfix/dashboard-sse-backpressure-20260827
      - name: Repair generated helper docstring and compile
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/src/waterfallhunter/main.py")
          lines = path.read_text().splitlines()
          matches = [
              index
              for index, line in enumerate(lines)
              if "Return the bounded latest-wins queue used by one SSE client." in line
          ]
          if len(matches) != 1:
              raise SystemExit(f"expected one queue helper docstring, found {len(matches)}")
          lines[matches[0]] = '    """Return the bounded latest-wins queue used by one SSE client."""'
          path.write_text("\n".join(lines) + "\n")
          PY
          python -m py_compile backend/src/waterfallhunter/main.py
          git diff --check
          if git diff --quiet; then
            echo "Syntax already repaired; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/waterfallhunter/main.py
          git commit -m "fix: repair SSE queue helper syntax"
          git push origin HEAD:hotfix/dashboard-sse-backpressure-20260827
