name: Deploy Production

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: waterfallhunter-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      WFH_DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      WFH_PROD_HOST: ${{ secrets.WFH_PROD_HOST }}
      WFH_PROD_PORT: ${{ secrets.WFH_PROD_PORT }}
      WFH_PROD_USER: ${{ secrets.WFH_PROD_USER }}
    steps:
      - name: Checkout exact CI revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact successful main revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$WFH_DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$WFH_DEPLOY_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$WFH_DEPLOY_SHA" origin/main

      - name: Validate Production connection contract
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WFH_PROD_HOST"
          test -n "$WFH_PROD_USER"
          if [[ -n "$WFH_PROD_PORT" ]]; then
            [[ "$WFH_PROD_PORT" =~ ^[0-9]+$ ]]
          fi

      - name: Configure pinned SSH identity
        shell: bash
        env:
          WFH_PROD_SSH_KEY: ${{ secrets.WFH_PROD_SSH_KEY }}
          WFH_PROD_KNOWN_HOSTS: ${{ secrets.WFH_PROD_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$WFH_PROD_SSH_KEY"
          test -n "$WFH_PROD_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$WFH_PROD_SSH_KEY" > "$HOME/.ssh/waterfallhunter-deploy"
          chmod 600 "$HOME/.ssh/waterfallhunter-deploy"
          printf '%s\n' "$WFH_PROD_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy exact CI revision
        shell: bash
        run: |
          set -euo pipefail
          port="${WFH_PROD_PORT:-22}"
          ssh \
            -i "$HOME/.ssh/waterfallhunter-deploy" \
            -p "$port" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$WFH_PROD_USER@$WFH_PROD_HOST" \
            "WFH_DEPLOY_SHA='$WFH_DEPLOY_SHA' WFH_DEPLOY_ROOT='/srv/waterfallhunter/app' bash -s" \
            < scripts/deploy_production.sh
