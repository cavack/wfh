name: Temporary dashboard SSE queue patch

on:
  push:
    branches:
      - hotfix/dashboard-sse-backpressure-20260827

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: hotfix/dashboard-sse-backpressure-20260827
      - name: Apply bounded slow-client queue patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/src/waterfallhunter/main.py")
          text = path.read_text()

          constant_anchor = "_DASHBOARD_REPLAY_EVENT_LIMIT = 8\n"
          constant_insert = (
              "_DASHBOARD_REPLAY_EVENT_LIMIT = 8\n"
              "_DASHBOARD_CLIENT_QUEUE_LIMIT = 2\n"
          )
          if "_DASHBOARD_CLIENT_QUEUE_LIMIT = 2" not in text:
              if constant_anchor not in text:
                  raise SystemExit("dashboard replay constant anchor not found")
              text = text.replace(constant_anchor, constant_insert, 1)

          broadcast_anchor = "def _broadcast_dashboard_event(event: DashboardStreamEvent) -> None:\n"
          helper = (
              "def _new_dashboard_client_queue() -> asyncio.Queue:\n"
              "    \\\"\\\"\\\"Return the bounded latest-wins queue used by one SSE client.\\\"\\\"\\\"\n"
              "    return asyncio.Queue(maxsize=_DASHBOARD_CLIENT_QUEUE_LIMIT)\n\n\n"
          )
          if "def _new_dashboard_client_queue()" not in text:
              if broadcast_anchor not in text:
                  raise SystemExit("dashboard broadcast anchor not found")
              text = text.replace(broadcast_anchor, helper + broadcast_anchor, 1)

          old_queue = "    q = asyncio.Queue(\n        maxsize=100\n    )\n"
          new_queue = "    q = _new_dashboard_client_queue()\n"
          if old_queue in text:
              text = text.replace(old_queue, new_queue, 1)
          elif new_queue not in text:
              raise SystemExit("SSE client queue anchor not found")

          path.write_text(text)
          PY
          git diff --check
          if git diff --quiet; then
            echo "Patch already present; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/waterfallhunter/main.py
          git commit -m "fix: bound per-client SSE queue"
          git push origin HEAD:hotfix/dashboard-sse-backpressure-20260827
