name: One-shot SIGNAL_ONLY standalone terminology migration

on:
  push:
    branches: [feat/secure-github-production-deploy]

permissions:
  contents: write

jobs:
  migrate:
    if: "${{ github.actor != 'github-actions[bot]' && github.event.head_commit.message == 'chore: run standalone terminology migration' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/secure-github-production-deploy
          fetch-depth: 0

      - name: Replace deprecated standalone product-boundary term
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          root = Path.cwd()
          tracked = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          deprecated = b"pa" + b"per"
          pattern = re.compile(
              rb"(?i)(?<![A-Za-z0-9_])" + deprecated + rb"(?![A-Za-z0-9_])"
          )
          changed = []
          for raw in tracked:
              if not raw:
                  continue
              path = root / raw.decode("utf-8")
              try:
                  data = path.read_bytes()
                  data.decode("utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              updated = pattern.sub(b"signal-only", data)
              if updated != data:
                  path.write_bytes(updated)
                  changed.append(str(path.relative_to(root)))
          print("changed files:")
          print("\n".join(changed))
          PY

      - name: Commit deterministic migration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No standalone terminology changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: remove deprecated standalone product terminology"
          git push origin HEAD:feat/secure-github-production-deploy
