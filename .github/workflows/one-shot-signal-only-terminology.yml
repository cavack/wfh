name: One-shot SIGNAL_ONLY terminology migration

on:
  push:
    branches: [feat/secure-github-production-deploy]

permissions:
  contents: write

jobs:
  migrate:
    if: "${{ github.actor != 'github-actions[bot]' && github.event.head_commit.message == 'chore: run signal-only terminology migration' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/secure-github-production-deploy
          fetch-depth: 0

      - name: Replace deprecated product-boundary terminology
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess

          root = Path.cwd()
          tracked = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          replacements = (
              (b"PAPER_ONLY", b"SIGNAL_ONLY"),
              (b"Paper-only", b"Signal-only"),
              (b"paper-only", b"signal-only"),
              (b"PAPER-ONLY", b"SIGNAL-ONLY"),
              (b"Paper trading", b"Signal-only operation"),
              (b"paper trading", b"signal-only operation"),
              (b"Paper-trading", b"Signal-only"),
              (b"paper-trading", b"signal-only"),
          )
          changed = []
          for raw in tracked:
              if not raw:
                  continue
              relative = raw.decode("utf-8")
              if relative == ".github/workflows/one-shot-signal-only-terminology.yml":
                  continue
              path = root / relative
              try:
                  data = path.read_bytes()
                  data.decode("utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              updated = data
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != data:
                  path.write_bytes(updated)
                  changed.append(str(path.relative_to(root)))
          print("changed files:")
          print("\n".join(changed))
          PY

      - name: Commit deterministic migration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No terminology changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: migrate product boundary to SIGNAL_ONLY"
          git push origin HEAD:feat/secure-github-production-deploy
