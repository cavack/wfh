name: Wave1C2 Task5 Exact Patch

on:
  push:
    branches:
      - feat/wave1c2-persistence-legacy-classification-v1
    paths:
      - .github/workflows/wave1c2-task5-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: run wave1c2 task5 exact patch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/wave1c2-persistence-legacy-classification-v1
          fetch-depth: 0
      - name: Apply exact Task 5 producer patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label} anchor count={count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          validator = Path('backend/src/waterfallhunter/core/multi_exchange_validator.py')
          replace_once(
              validator,
              'from waterfallhunter.core.score_v2 import ScoreV2\nfrom waterfallhunter.core.ws_streamer import WebSocketManager\n',
              'from waterfallhunter.core.score_v2 import ScoreV2\nfrom waterfallhunter.core.signal_metadata import STRICT_STRATEGY_PROFILE\nfrom waterfallhunter.core.ws_streamer import WebSocketManager\n',
              'validator import',
          )
          replace_once(
              validator,
              '''        else:\n            base_score = score_result["score"]\n            metrics["trade_eligible"] = True\n\n        status = (\n''',
              '''        else:\n            base_score = score_result["score"]\n            metrics["trade_eligible"] = True\n            metrics["strategy_profile"] = STRICT_STRATEGY_PROFILE\n\n        status = (\n''',
              'strict profile emission',
          )

          main = Path('backend/src/waterfallhunter/main.py')
          replace_once(
              main,
              'from waterfallhunter.core.decision_provenance import build_decision_contract\n',
              '''from waterfallhunter.core.decision_provenance import (\n    build_decision_contract,\n    decision_contract_sha256,\n)\n''',
              'main decision provenance import',
          )
          replace_once(
              main,
              '''from waterfallhunter.core.lbank_signal_ledger import (\n    LBankSignalLedger,\n)\n''',
              '''from waterfallhunter.core.lbank_signal_ledger import (\n    LBankSignalLedger,\n)\nfrom waterfallhunter.core.signal_metadata import build_signal_metadata_input\n''',
              'main signal metadata import',
          )
          replace_once(
              main,
              '''async def evaluate_candidate(\n    symbol: str,\n    data: dict,\n):\n    scanner.active_candidates.setdefault(\n''',
              '''async def evaluate_candidate(\n    symbol: str,\n    data: dict,\n):\n    analysis_observed_at = int(time.time())\n\n    scanner.active_candidates.setdefault(\n''',
              'analysis observation timestamp',
          )
          replace_once(
              main,
              '''        recorder_bucket_seconds=(\n            production_evidence_recorder.bucket_seconds\n        ),\n    )\n\n    if lbank_price is None:\n''',
              '''        recorder_bucket_seconds=(\n            production_evidence_recorder.bucket_seconds\n        ),\n    )\n    decision_contract_hash = decision_contract_sha256(decision_contract)\n\n    if lbank_price is None:\n''',
              'decision contract hash',
          )
          replace_once(
              main,
              '''        live_data[\n            "reference_observed_at"\n        ] = time.time()\n\n        live_data[\n            "reference_source"\n''',
              '''        live_data[\n            "reference_observed_at"\n        ] = time.time()\n        reference_observed_at = live_data[\n            "reference_observed_at"\n        ]\n\n        live_data[\n            "reference_source"\n''',
              'fallback reference observation timestamp',
          )
          replace_once(
              main,
              '''        signal_id = signal_ledger.persist_trigger(\n            symbol,\n''',
              '''        metadata_reference_observed_at = (\n            int(reference_observed_at)\n            if (\n                isinstance(reference_observed_at, (int, float))\n                and not isinstance(reference_observed_at, bool)\n                and reference_observed_at >= 0\n            )\n            else None\n        )\n        try:\n            signal_metadata = build_signal_metadata_input(\n                {\n                    **metrics,\n                    "analysis_observed_at": analysis_observed_at,\n                    "reference_observed_at": metadata_reference_observed_at,\n                },\n                decision_contract_hash,\n            )\n        except ValueError as exc:\n            record_final_production_decision(\n                "METADATA_REJECTED",\n                "explicit signal metadata validation failed",\n                error_type=type(exc).__name__,\n            )\n            logger.error(\n                "Signal metadata validation failed for %s: %s",\n                symbol,\n                exc,\n            )\n            return\n\n        signal_id = signal_ledger.persist_trigger(\n            symbol,\n''',
              'metadata build before persistence',
          )
          replace_once(
              main,
              '''            execution_suitability=(\n                execution_suitability\n            ),\n            quote_volume=quote_volume,\n''',
              '''            execution_suitability=(\n                execution_suitability\n            ),\n            metadata=signal_metadata,\n            quote_volume=quote_volume,\n''',
              'metadata persistence argument',
          )
          PY
          git diff --check
          git diff -- backend/src/waterfallhunter/main.py backend/src/waterfallhunter/core/multi_exchange_validator.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/src/waterfallhunter/main.py backend/src/waterfallhunter/core/multi_exchange_validator.py
          git commit -m 'feat: emit explicit signal lineage at persistence boundary'
          git push origin HEAD:feat/wave1c2-persistence-legacy-classification-v1
