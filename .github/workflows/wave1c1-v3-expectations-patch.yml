name: Wave1C1 V3 Expectations Patch

on:
  push:
    branches:
      - feat/wave1c1-metadata-foundation-v1
    paths:
      - .github/workflows/wave1c1-v3-expectations-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/wave1c1-metadata-foundation-v1
      - name: Apply exact v3 compatibility patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def edit(path_str, replacements):
              path = Path(path_str)
              text = path.read_text()
              for old, new, expected_count in replacements:
                  actual = text.count(old)
                  if actual != expected_count:
                      raise SystemExit(
                          f'{path}: expected {expected_count} matches, found {actual}: {old[:100]!r}'
                      )
                  text = text.replace(old, new)
              path.write_text(text)

          edit(
              'backend/src/waterfallhunter/core/migration_preflight.py',
              [(
                  '''_LEGACY_OPTIONAL_TABLES = frozenset(\n    {\n        "lbank_execution_observations",\n        "lbank_execution_observation_history",\n        "provider_states",\n    }\n)''',
                  '''_LEGACY_OPTIONAL_TABLES = frozenset(\n    {\n        "lbank_execution_observations",\n        "lbank_execution_observation_history",\n        "provider_states",\n        "signal_metadata",\n    }\n)''',
                  1,
              )],
          )

          edit(
              'backend/tests/test_migrations.py',
              [
                  ('assert [item.version for item in discovered] == [1, 2]',
                   'assert [item.version for item in discovered] == [1, 2, 3]', 2),
                  ('''    assert [item.name for item in discovered] == [\n        "db_readiness_probe",\n        "runtime_schema_baseline",\n    ]''',
                   '''    assert [item.name for item in discovered] == [\n        "db_readiness_probe",\n        "runtime_schema_baseline",\n        "signal_metadata",\n    ]''', 1),
              ],
          )

          edit(
              'backend/tests/test_migration_verify.py',
              [
                  ('assert runner.apply() == (1, 2)', 'assert runner.apply() == (1, 2, 3)', 1),
                  ('assert runner.verify() == (1, 2)', 'assert runner.verify() == (1, 2, 3)', 1),
              ],
          )

          edit(
              'backend/tests/test_migration_preflight.py',
              [
                  ('assert result.applied_versions == (1, 2)', 'assert result.applied_versions == (1, 2, 3)', 1),
                  ('assert result.user_version == 2', 'assert result.user_version == 3', 1),
              ],
          )

          edit(
              'backend/tests/test_migrate_database_cli.py',
              [
                  ('def test_cli_apply_clean_install_sets_wal_and_verifies_schema_v2(',
                   'def test_cli_apply_clean_install_sets_wal_and_verifies_schema_v3(', 1),
                  ('assert payload["applied_versions"] == [1, 2]',
                   'assert payload["applied_versions"] == [1, 2, 3]', 1),
                  ('assert payload["user_version"] == 2',
                   'assert payload["user_version"] == 3', 1),
                  ('assert conn.execute("PRAGMA user_version").fetchone()[0] == 2',
                   'assert conn.execute("PRAGMA user_version").fetchone()[0] == 3', 1),
              ],
          )

          edit(
              'backend/tests/test_runtime_schema_migration.py',
              [
                  ('assert [item.version for item in migrations] == [1, 2]',
                   'assert [item.version for item in migrations] == [1, 2, 3]', 1),
                  ('assert runner.apply() == (1, 2)',
                   'assert runner.apply() == (1, 2, 3)', 3),
                  ('assert runner.verify() == (1, 2)',
                   'assert runner.verify() == (1, 2, 3)', 2),
                  ('''    assert history == [\n        (1, "test-legacy-adoption"),\n        (2, "test-legacy-adoption"),\n    ]''',
                   '''    assert history == [\n        (1, "test-legacy-adoption"),\n        (2, "test-legacy-adoption"),\n        (3, "test-legacy-adoption"),\n    ]''', 1),
              ],
          )

          edit(
              'backend/tests/test_schema_contract.py',
              [
                  ('''        "provider_states",\n    }''',
                   '''        "provider_states",\n        "signal_metadata",\n    }''', 1),
                  ('assert CURRENT_RUNTIME_SCHEMA_VERSION == 2',
                   'assert CURRENT_RUNTIME_SCHEMA_VERSION == 3', 1),
              ],
          )
          PY
          python -m compileall -q backend/src backend/tests
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "cavack"
          git config user.email "30337601+cavack@users.noreply.github.com"
          git add backend/src/waterfallhunter/core/migration_preflight.py \
                  backend/tests/test_migrations.py \
                  backend/tests/test_migration_verify.py \
                  backend/tests/test_migration_preflight.py \
                  backend/tests/test_migrate_database_cli.py \
                  backend/tests/test_runtime_schema_migration.py \
                  backend/tests/test_schema_contract.py
          git diff --cached --quiet && exit 0
          git commit -m "test: align migration verification with schema v3"
          git push origin HEAD:feat/wave1c1-metadata-foundation-v1
