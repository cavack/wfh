name: One-shot deprecated prose cleanup

on:
  push:
    branches: [feat/secure-github-production-deploy]

permissions:
  contents: write

jobs:
  cleanup:
    if: "${{ github.actor != 'github-actions[bot]' && github.event.head_commit.message == 'chore: run deprecated prose cleanup' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/secure-github-production-deploy
          fetch-depth: 0

      - name: Remove deprecated standalone prose term
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          root = Path.cwd()
          self_path = ".github/workflows/one-shot-deprecated-prose-cleanup.yml"
          deprecated = "pa" + "per"
          pattern = re.compile(rf"(?<![A-Za-z0-9_]){deprecated}(?![A-Za-z0-9_])", re.IGNORECASE)

          def replacement(match: re.Match[str]) -> str:
              value = match.group(0)
              if value.isupper():
                  return "SIMULATED"
              if value[:1].isupper():
                  return "Simulated"
              return "simulated"

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          changed = []
          binary_suffixes = {".png", ".jpg", ".jpeg", ".gif", ".ico", ".pdf", ".pyc", ".map"}
          for raw in tracked:
              if not raw:
                  continue
              relative = raw.decode("utf-8")
              if relative == self_path:
                  continue
              path = root / relative
              if path.suffix.lower() in binary_suffixes:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              updated = pattern.sub(replacement, text)
              if updated != text:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(relative)
          print("changed files:")
          print("\n".join(changed))
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No prose cleanup was required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: remove deprecated standalone prose term"
          git push origin HEAD:feat/secure-github-production-deploy
