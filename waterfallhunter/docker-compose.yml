services:
  waterfall-backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: waterfall-backend
    restart: unless-stopped
    env_file:
      - .env
    network_mode: "host"
    volumes:
      - ./backend/src:/app/src
      - waterfall_data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: waterfall-frontend
    restart: unless-stopped
    network_mode: "host"
    depends_on:
      - waterfall-backend

  ollama:
    image: ollama/ollama:latest
    container_name: waterfall-ollama
    restart: always
    network_mode: "host"
    volumes:
      - ollama_data:/root/.ollama

  watchdog:
    build: 
      context: ./watchdog
      dockerfile: Dockerfile
    container_name: waterfall-watchdog
    restart: unless-stopped
    network_mode: "host"
    env_file:
      - .env

  prometheus:
    image: prom/prometheus:latest
    container_name: waterfall-prometheus
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: waterfall-grafana
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  waterfall_data:
  prometheus_data:
  grafana_data:
  ollama_data:
