# WaterfallHunter migrations use SQLite syntax, not Oracle PL/SQL. Sonar's
# default assigns .sql files to the PL/SQL analyzer, whose CREATE OR REPLACE
# rules are invalid for SQLite. Keep PL/SQL analysis reserved for actual
# .plsql sources; migration correctness is enforced by schema-contract,
# migration, tamper, and postflight tests.
sonar.plsql.file.suffixes=.plsql
